<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rodka Research — Asesoría metodológica</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&family=Space+Mono&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #F8F6F1; font-family: 'Inter', sans-serif; }
</style>
</head>
<body>
<div id="root">Cargando…</div>

<script>
  window.addEventListener('error', function(e) {
    document.getElementById('root').innerHTML =
      '<div style="padding:24px;font-family:monospace;color:#900;background:#fee;white-space:pre-wrap;">Error: ' +
      (e.message || 'desconocido') + '</div>';
  });
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js" crossorigin></script>

<script type="text/babel" data-presets="react">
const { useState } = React;

const SERVICES = [
  { id: 'metodologia', label: 'Diseño metodológico', desc: 'PICOT/PECO, tipo de estudio, variables', price: 45 },
  { id: 'estadistica', label: 'Análisis estadístico', desc: 'SPSS, Stata o R — corrección o ejecución', price: 60 },
  { id: 'redaccion', label: 'Redacción y formato', desc: 'Normas APA/Vancouver, coherencia, estilo', price: 35 },
  { id: 'completo', label: 'Revisión completa', desc: 'Los tres anteriores integrados', price: 110 },
];

const STEPS = ['Entrada', 'Tu trabajo', 'Qué necesitas', 'Contacto', 'Confirmación'];

function RodkaIntake() {
  const [step, setStep] = useState(0);
  const [entryPath, setEntryPath] = useState(null);
  const [fileName, setFileName] = useState('');
  const [docType, setDocType] = useState('');
  const [service, setService] = useState(null);
  const [notes, setNotes] = useState('');
  const [name, setName] = useState('');
  const [email, setEmail] = useState('');
  const [phone, setPhone] = useState('');
  const [submitted, setSubmitted] = useState(false);

  const selectedService = SERVICES.find(s => s.id === service);
  const isDiagnostico = entryPath === 'diagnostico';

  const canAdvance = [
    entryPath !== null,
    docType.trim().length > 0,
    isDiagnostico ? true : service !== null,
    name.trim().length > 0 && email.trim().length > 0,
    true,
  ];

  const handleFile = (e) => {
    if (e.target.files && e.target.files[0]) {
      setFileName(e.target.files[0].name);
    }
  };

  // NOTA PARA VERÓNICA: aquí es donde luego conectamos el envío real
  // (a Google Sheets, correo, o el generador de link de pago).
  // Por ahora solo muestra la pantalla de confirmación.
  const submit = () => setSubmitted(true);

  const resetAll = () => {
    setStep(0);
    setEntryPath(null);
    setFileName('');
    setDocType('');
    setService(null);
    setNotes('');
    setName('');
    setEmail('');
    setPhone('');
    setSubmitted(false);
  };

  return (
    <div style={styles.page}>
      <header style={styles.header}>
        <div style={styles.wordmark}>RODKA <span style={{ color: '#C9A227' }}>RESEARCH</span></div>
        <div style={styles.tagline}>Asesoría metodológica sin salir de tu casa</div>
      </header>

      {!submitted ? (
        <div style={styles.card}>
          <div style={styles.stepBar}>
            {STEPS.map((s, i) => (
              <div key={s} style={styles.stepItem}>
                <div style={{
                  ...styles.stepDot,
                  background: i < step ? '#C9A227' : i === step ? '#0C2340' : '#E4E0D5',
                  color: i <= step ? '#F8F6F1' : '#8A8676',
                }}>{i + 1}</div>
                {i < STEPS.length - 1 && <div style={styles.stepLine} />}
              </div>
            ))}
          </div>

          <div style={styles.body}>
            {step === 0 && (
              <div>
                <h2 style={styles.h2}>¿Por dónde quieres empezar?</h2>
                <p style={styles.sub}>Elige la opción que te haga sentido según lo que necesitas.</p>
                <div style={styles.serviceGrid}>
                  <button
                    onClick={() => setEntryPath('diagnostico')}
                    style={{
                      ...styles.serviceCard,
                      borderColor: entryPath === 'diagnostico' ? '#4EC9C0' : '#E4E0D5',
                      background: entryPath === 'diagnostico' ? '#EFFAF9' : '#FFFFFF',
                    }}
                  >
                    <div style={styles.serviceTop}>
                      <span style={styles.serviceLabel}>Diagnóstico</span>
                      <span style={{ ...styles.servicePrice, color: '#4EC9C0' }}>$5</span>
                    </div>
                    <span style={styles.serviceDesc}>Reviso tu documento y te envío un informe: qué está mal, qué falta y cuánto tiempo tomaría arreglarlo.</span>
                  </button>
                  <button
                    onClick={() => setEntryPath('completo')}
                    style={{
                      ...styles.serviceCard,
                      borderColor: entryPath === 'completo' ? '#C9A227' : '#E4E0D5',
                      background: entryPath === 'completo' ? '#FBF7EC' : '#FFFFFF',
                    }}
                  >
                    <div style={styles.serviceTop}>
                      <span style={styles.serviceLabel}>Servicio completo</span>
                      <span style={styles.servicePrice}>desde $35</span>
                    </div>
                    <span style={styles.serviceDesc}>Ya sabes qué necesitas arreglar — vamos directo a la corrección.</span>
                  </button>
                </div>
                {isDiagnostico && (
                  <p style={{ ...styles.sub, marginTop: 14, fontSize: 12 }}>
                    Si luego decides continuar con el servicio completo, los $5 se descuentan de tu tarifa.
                  </p>
                )}
              </div>
            )}

            {step === 1 && (
              <div>
                <h2 style={styles.h2}>Cuéntame de tu trabajo</h2>
                <p style={styles.sub}>Sube el documento y dime de qué tipo es.</p>
                <label style={styles.label}>Documento</label>
                <label style={styles.fileBox}>
                  <input type="file" accept=".docx,.doc,.pdf,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" onChange={handleFile} style={{ display: 'none' }} />
                  {fileName ? (
                    <span style={{ color: '#0C2340', fontWeight: 500 }}>{fileName}</span>
                  ) : (
                    <span style={{ color: '#8A8676' }}>Toca para adjuntar (.docx, .pdf)</span>
                  )}
                </label>
                <label style={styles.label}>Tipo de documento</label>
                <select value={docType} onChange={e => setDocType(e.target.value)} style={styles.input}>
                  <option value="">Selecciona una opción</option>
                  <option value="protocolo">Protocolo de investigación</option>
                  <option value="tesis">Tesis o trabajo de grado</option>
                  <option value="articulo">Artículo científico</option>
                  <option value="otro">Otro</option>
                </select>
              </div>
            )}

            {step === 2 && !isDiagnostico && (
              <div>
                <h2 style={styles.h2}>¿Qué necesitas arreglar?</h2>
                <p style={styles.sub}>Elige el servicio que mejor se ajusta.</p>
                <div style={styles.serviceGrid}>
                  {SERVICES.map(s => (
                    <button
                      key={s.id}
                      onClick={() => setService(s.id)}
                      style={{
                        ...styles.serviceCard,
                        borderColor: service === s.id ? '#C9A227' : '#E4E0D5',
                        background: service === s.id ? '#FBF7EC' : '#FFFFFF',
                      }}
                    >
                      <div style={styles.serviceTop}>
                        <span style={styles.serviceLabel}>{s.label}</span>
                        <span style={styles.servicePrice}>${s.price}</span>
                      </div>
                      <span style={styles.serviceDesc}>{s.desc}</span>
                    </button>
                  ))}
                </div>
                <label style={styles.label}>Detalles adicionales (opcional)</label>
                <textarea
                  value={notes}
                  onChange={e => setNotes(e.target.value)}
                  placeholder="Ej: el asesor pidió cambiar el diseño de PECO a PICOT, plazo de entrega, etc."
                  style={{ ...styles.input, minHeight: 80, resize: 'vertical' }}
                />
              </div>
            )}

            {step === 2 && isDiagnostico && (
              <div>
                <h2 style={styles.h2}>Cuéntame un poco más</h2>
                <p style={styles.sub}>Esto me ayuda a orientar el diagnóstico.</p>
                <label style={styles.label}>¿Qué te preocupa de tu trabajo? (opcional)</label>
                <textarea
                  value={notes}
                  onChange={e => setNotes(e.target.value)}
                  placeholder="Ej: no estoy segura si el diseño metodológico está bien, o si el análisis estadístico es el correcto."
                  style={{ ...styles.input, minHeight: 80, resize: 'vertical' }}
                />
              </div>
            )}

            {step === 3 && (
              <div>
                <h2 style={styles.h2}>¿Dónde te contactamos?</h2>
                <p style={styles.sub}>Recibirás {isDiagnostico ? 'tu diagnóstico' : 'la cotización y el trabajo terminado'} por aquí.</p>
                <label style={styles.label}>Nombre completo</label>
                <input value={name} onChange={e => setName(e.target.value)} style={styles.input} placeholder="Tu nombre" />
                <label style={styles.label}>Correo electrónico</label>
                <input value={email} onChange={e => setEmail(e.target.value)} style={styles.input} placeholder="tu@correo.com" type="email" />
                <label style={styles.label}>WhatsApp (opcional)</label>
                <input value={phone} onChange={e => setPhone(e.target.value)} style={styles.input} placeholder="+503 ...." />
              </div>
            )}

            {step === 4 && (
              <div>
                <h2 style={styles.h2}>Revisa antes de enviar</h2>
                <div style={styles.summaryBox}>
                  <div style={styles.summaryRow}><span>Entrada</span><strong>{isDiagnostico ? 'Diagnóstico' : 'Servicio completo'}</strong></div>
                  <div style={styles.summaryRow}><span>Documento</span><strong>{fileName || '—'}</strong></div>
                  <div style={styles.summaryRow}><span>Tipo</span><strong>{docType || '—'}</strong></div>
                  {!isDiagnostico && (
                    <div style={styles.summaryRow}><span>Servicio</span><strong>{selectedService ? selectedService.label : '—'}</strong></div>
                  )}
                  <div style={styles.summaryRow}><span>Tarifa</span><strong style={{ color: isDiagnostico ? '#4EC9C0' : '#C9A227' }}>${isDiagnostico ? '5' : (selectedService ? selectedService.price : '—')}</strong></div>
                  <div style={styles.summaryRow}><span>Contacto</span><strong>{name || '—'}</strong></div>
                </div>
                <p style={{ ...styles.sub, marginTop: 16 }}>
                  {isDiagnostico
                    ? 'Al pagar los $5, recibirás tu informe de diagnóstico en 24-48h junto con un link para continuar con el servicio completo si lo decides — con el descuento ya aplicado.'
                    : 'Al enviar, recibirás en tu correo el link de pago y el plazo de entrega estimado.'}
                </p>
              </div>
            )}
          </div>

          <div style={styles.footer}>
            {step > 0 && (
              <button onClick={() => setStep(step - 1)} style={styles.ghostBtn}>Atrás</button>
            )}
            <div style={{ flex: 1 }} />
            {step < 4 ? (
              <button
                disabled={!canAdvance[step]}
                onClick={() => setStep(step + 1)}
                style={{ ...styles.primaryBtn, opacity: canAdvance[step] ? 1 : 0.4 }}
              >
                Continuar
              </button>
            ) : (
              <button onClick={submit} style={styles.primaryBtn}>
                {isDiagnostico ? 'Pagar $5 y enviar' : 'Enviar solicitud'}
              </button>
            )}
          </div>
        </div>
      ) : (
        <div style={styles.card}>
          <div style={styles.body}>
            <div style={styles.confirmMark}>✓</div>
            <h2 style={{ ...styles.h2, textAlign: 'center' }}>Solicitud recibida</h2>
            <p style={{ ...styles.sub, textAlign: 'center' }}>
              {isDiagnostico
                ? <>Te escribiremos a <strong>{email}</strong> con tu diagnóstico en 24-48 horas, junto con el link para continuar si decides contratar el servicio completo.</>
                : <>Te escribiremos a <strong>{email}</strong> con la cotización y el link de pago en menos de 24 horas.</>}
            </p>
          </div>
          <div style={styles.footer}>
            <div style={{ flex: 1 }} />
            <button onClick={resetAll} style={styles.ghostBtn}>Empezar de nuevo</button>
          </div>
        </div>
      )}

      <div style={styles.trust}>Metodología · Análisis estadístico · Redacción científica</div>
    </div>
  );
}

const styles = {
  page: {
    minHeight: '100vh', background: '#F8F6F1', fontFamily: "'Inter', sans-serif",
    display: 'flex', flexDirection: 'column', alignItems: 'center', padding: '32px 16px 48px',
  },
  header: { textAlign: 'center', marginBottom: 28 },
  wordmark: { fontFamily: "'Playfair Display', serif", fontSize: 28, fontWeight: 700, color: '#0C2340', letterSpacing: 1 },
  tagline: { fontFamily: "'Space Mono', monospace", fontSize: 13, color: '#4EC9C0', marginTop: 6 },
  card: { width: '100%', maxWidth: 480, background: '#FFFFFF', borderRadius: 4, border: '1px solid #E4E0D5', overflow: 'hidden' },
  stepBar: { display: 'flex', alignItems: 'center', padding: '20px 24px 16px', borderBottom: '1px solid #EFEBE0' },
  stepItem: { display: 'flex', alignItems: 'center', flex: 1 },
  stepDot: { width: 24, height: 24, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 12, fontWeight: 600, flexShrink: 0 },
  stepLine: { flex: 1, height: 1, background: '#E4E0D5', margin: '0 4px' },
  body: { padding: '28px 24px 8px' },
  h2: { fontFamily: "'Playfair Display', serif", fontSize: 22, color: '#0C2340', margin: '0 0 6px' },
  sub: { fontSize: 14, color: '#6B6A5F', margin: '0 0 20px', lineHeight: 1.5 },
  label: { display: 'block', fontSize: 12, fontWeight: 600, color: '#0C2340', marginBottom: 6, marginTop: 16 },
  input: { width: '100%', padding: '11px 12px', fontSize: 14, border: '1px solid #E4E0D5', borderRadius: 3, fontFamily: "'Inter', sans-serif", color: '#0C2340', background: '#FCFBF8', boxSizing: 'border-box' },
  fileBox: { display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '18px 12px', border: '1px dashed #C9A227', borderRadius: 3, background: '#FBF7EC', cursor: 'pointer', fontSize: 13, textAlign: 'center' },
  serviceGrid: { display: 'flex', flexDirection: 'column', gap: 8 },
  serviceCard: { textAlign: 'left', border: '1px solid #E4E0D5', borderRadius: 3, padding: '12px 14px', cursor: 'pointer', width: '100%' },
  serviceTop: { display: 'flex', justifyContent: 'space-between', marginBottom: 4 },
  serviceLabel: { fontSize: 14, fontWeight: 600, color: '#0C2340' },
  servicePrice: { fontFamily: "'Space Mono', monospace", fontSize: 13, color: '#C9A227' },
  serviceDesc: { fontSize: 12, color: '#8A8676' },
  summaryBox: { border: '1px solid #E4E0D5', borderRadius: 3, padding: '4px 16px', background: '#FCFBF8' },
  summaryRow: { display: 'flex', justifyContent: 'space-between', fontSize: 13, padding: '10px 0', borderBottom: '1px solid #EFEBE0', color: '#0C2340' },
  footer: { display: 'flex', alignItems: 'center', padding: '16px 24px', borderTop: '1px solid #EFEBE0' },
  ghostBtn: { background: 'none', border: 'none', color: '#6B6A5F', fontSize: 14, cursor: 'pointer', padding: '8px 4px' },
  primaryBtn: { background: '#0C2340', color: '#F8F6F1', border: 'none', borderRadius: 3, padding: '11px 22px', fontSize: 14, fontWeight: 600, cursor: 'pointer' },
  confirmMark: { width: 48, height: 48, borderRadius: '50%', background: '#4EC9C0', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 24, margin: '0 auto 16px' },
  trust: { fontFamily: "'Space Mono', monospace", fontSize: 11, color: '#8A8676', marginTop: 24, letterSpacing: 0.5 },
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<RodkaIntake />);
</script>
</body>
</html>
